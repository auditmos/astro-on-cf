name: Compatibility date freshness

on:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC — one hour after deps-update
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compat-date
  cancel-in-progress: false

env:
  # Future-proof: opt into Node 24 for JS actions before GH forces it (2026-06-02 default, 2026-09-16 hard cutoff)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `pnpm install` runs `prepare` -> simple-git-hooks, which installs the pre-push
  # hook into the CI runner, where it then fires on every automated push
  # (create-pull-request, semantic-release) and can reject the push over checks
  # CI has already run. Hooks are a local dev net; the explicit steps below are
  # the CI contract, and they report per-step instead of failing inside a push.
  SKIP_SIMPLE_GIT_HOOKS: "1"
  STALE_THRESHOLD_DAYS: "90"

jobs:
  bump:
    name: Bump compatibility_date if stale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install comes before the plan: the target is capped at the oldest installed
      # workerd, since a date past it fails `astro check` and the build.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Explicit rather than lts/* — see the rationale in ci.yml. The three
          # declarations of the Node major are asserted together by
          # scripts/repo-hygiene.test.ts.
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Sets bump, current, age_days and, when bumping, target and limited_by.
      # A stale date no runtime can move past exits green with a warning.
      - name: Plan compatibility_date
        id: plan
        run: pnpm exec tsx scripts/compat-date.ts

      - name: Bump compatibility_date in wrangler.jsonc
        if: steps.plan.outputs.bump == 'true'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          perl -i -pe 's/("compatibility_date"\s*:\s*")\d{4}-\d{2}-\d{2}(")/${1}$ENV{TARGET}${2}/' wrangler.jsonc
          echo "::group::Diff"
          git --no-pager diff wrangler.jsonc
          echo "::endgroup::"

      - name: Regenerate Cloudflare types
        if: steps.plan.outputs.bump == 'true'
        run: pnpm run cf-typegen

      - name: Lint
        if: steps.plan.outputs.bump == 'true'
        run: pnpm run lint:ci

      - name: Type check
        if: steps.plan.outputs.bump == 'true'
        run: pnpm run types

      - name: Test
        if: steps.plan.outputs.bump == 'true'
        run: pnpm run test

      - name: Knip
        if: steps.plan.outputs.bump == 'true'
        run: pnpm run knip

      - name: Build
        if: steps.plan.outputs.bump == 'true'
        run: pnpm run build

      - name: Open PR
        if: steps.plan.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/compat-date-bump
          delete-branch: true
          commit-message: "chore(wrangler): bump compatibility_date to ${{ steps.plan.outputs.target }}"
          title: "chore(wrangler): bump compatibility_date to ${{ steps.plan.outputs.target }}"
          body: |
            Automated bump: `compatibility_date` was `${{ steps.plan.outputs.current }}`
            (${{ steps.plan.outputs.age_days }} days old, > ${{ env.STALE_THRESHOLD_DAYS }}-day threshold).

            Updated to `${{ steps.plan.outputs.target }}`: the earlier of today and the
            newest date every installed workerd runtime supports (limited by
            ${{ steps.plan.outputs.limited_by }}).

            Validated by this job before opening the PR:
            - `pnpm cf-typegen`
            - `pnpm lint:ci`
            - `pnpm types`
            - `pnpm test`
            - `pnpm knip`
            - `pnpm build`

            Reference: https://developers.cloudflare.com/workers/configuration/compatibility-dates/

            Note: `secrets.GITHUB_TOKEN` does not trigger CI on PRs it
            creates. Push an empty commit or click "Re-run all jobs" to
            kick CI.
          labels: enhancement
